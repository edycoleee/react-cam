version: '3.8'

services:
  react-cam:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-cam-app
    expose:
      - "4173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - react-cam-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - react-cam
    restart: unless-stopped
    networks:
      - react-cam-network

networks:
  react-cam-network:
    driver: bridge
